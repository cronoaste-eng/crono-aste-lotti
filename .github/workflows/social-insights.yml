name: Statistiche social

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "permessi (prova token e metriche, sola lettura) o raccogli"
        default: "permessi"

permissions:
  contents: write

concurrency:
  group: social-insights
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Librerie
        run: pip install requests==2.34.2 urllib3==2.8.0 certifi==2026.7.22 idna==3.20 charset-normalizer==3.5.1

      - name: Statistiche
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_INSIGHTS_TOKEN: ${{ secrets.FB_INSIGHTS_TOKEN }}
          FB_PAGE_ID: "174779944210177"
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          SOCIAL_INSIGHTS_MODE: ${{ github.event.inputs.mode || 'raccogli' }}
        run: python3 social_insights.py
