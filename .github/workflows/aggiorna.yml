name: Aggiorna lotti
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aggiorna-lotti
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scraper.py
      - name: Salva se cambiato
        if: always()
        run: |
          git config user.name "aggiornamento-lotti"
          git config user.email "actions@users.noreply.github.com"
          git add data/lotti.json data/archivio.json || true
          git diff --staged --quiet || (git commit -m "Aggiorna lotti" && git push)
