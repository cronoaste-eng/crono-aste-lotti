name: Aggiorna lotti
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aggiorna-lotti
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.34.2 beautifulsoup4==4.15.0 soupsieve==2.9.2 urllib3==2.8.0 certifi==2026.7.22 idna==3.20 charset-normalizer==3.5.1 typing-extensions==4.16.0
      - run: python scraper.py
      - name: Invia beni nuovi su Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python invia_telegram.py
      - name: Salva se cambiato
        if: always()
        run: |
          git config user.name "aggiornamento-lotti"
          git config user.email "actions@users.noreply.github.com"
          git add data/lotti.json data/archivio.json || true
          git add data/inviati.json || true
          git diff --staged --quiet || (git commit -m "Aggiorna lotti" && (git push || (git pull --rebase -X theirs && git push)))
