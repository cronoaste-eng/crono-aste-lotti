name: Pubblica su Facebook e Instagram

on:
  schedule:
    - cron: "7 7-18 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry (solo anteprima, non pubblica), uno (pubblica solo l'ultimo bene), storia (solo la Storia dell'ultimo bene) o send (normale)"
        default: "dry"
      force:
        description: "1 = ignora orario e giorno feriale"
        default: "0"

permissions:
  contents: read

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Font e librerie
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          pip install requests==2.34.2 pillow==12.3.0 urllib3==2.8.0 certifi==2026.7.22 idna==3.20 charset-normalizer==3.5.1

      - name: Ripristina stato
        uses: actions/cache@v4
        with:
          path: state_social
          key: social-${{ github.run_id }}
          restore-keys: |
            social-

      - name: Pubblica
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: "174779944210177"
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          SOCIAL_MODE: ${{ github.event.inputs.mode || 'send' }}
          SOCIAL_STORIE: "0"
          SOCIAL_FORCE: ${{ github.event.inputs.force || '0' }}
        run: python3 pubblica_social.py
